services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    profiles:
      - init
    depends_on:
      - db
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ./webcompanionapi/Scripts/create-database.sql:/scripts/create-database.sql:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        echo "Waiting for SQL Server..."
        for i in {1..60}; do
          if /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -l 5 -Q "SELECT 1" >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        if ! /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -l 5 -Q "SELECT 1" >/dev/null 2>&1; then
          echo "SQL Server not reachable or credentials invalid after 120s."
          exit 1
        fi
        echo "Running database init script..."
        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -i /scripts/create-database.sql
        echo "Database init complete."

  api:
    build:
      context: ./webcompanionapi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=db;Database=realestatewebcompanion;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  mssql_data:

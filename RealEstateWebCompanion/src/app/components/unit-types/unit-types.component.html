<div class="unit-types">
  <div class="header">
    <h2>Unit Types Management</h2>
    <div class="actions">
      <button class="btn btn-primary" (click)="saveAllChanges()" [disabled]="!hasPendingChanges || savingChanges">
        Save{{ pendingChangesCount ? ' (' + pendingChangesCount + ')' : '' }}
      </button>
      <button class="btn btn-success" (click)="addRow()">
        + Add Unit Type
      </button>
    </div>
  </div>

  @if (errorMessage) {
    <div class="error-banner" role="alert">
      <span>{{ errorMessage }}</span>
      <button class="error-dismiss" (click)="clearError()" aria-label="Dismiss">&times;</button>
    </div>
  }

  @if (isEditing && editingUnitType) {
    <div class="edit-form-overlay">
      <div class="edit-form">
        <h3>Edit Unit Type</h3>
        <form>
          <div class="form-group">
            <label for="id">ID:</label>
            <input type="text" id="id" [(ngModel)]="editingUnitType.id" name="id" class="form-control" readonly>
          </div>
          <div class="form-group">
            <label for="unitTypeNameEn">Unit Type (EN):</label>
            <input type="text" id="unitTypeNameEn" [(ngModel)]="editingUnitType.unitTypeNameEn" name="unitTypeNameEn" class="form-control">
          </div>
          <div class="form-group">
            <label for="unitTypeNameFr">Unit Type (FR):</label>
            <input type="text" id="unitTypeNameFr" [(ngModel)]="editingUnitType.unitTypeNameFr" name="unitTypeNameFr" class="form-control">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-primary" (click)="saveEdit()">Save</button>
            <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  }

  <ag-grid-angular
    style="width: 100%; height: 500px;"
    class="ag-theme-alpine"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [defaultColDef]="defaultColDef"
    [gridOptions]="gridOptions"
    (gridReady)="onGridReady($event)"
    (cellValueChanged)="onCellValueChanged($event)"
  />
</div>
